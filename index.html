<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timelog & Laporan OT Driver</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; background-color: #f0f2f5;}
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px;}
        
        .header-card { background-color: #2196F3; color: white; text-align: center; }
        .header-card h1 { margin: 0; font-size: 1.5rem; }
        .header-card p { margin: 5px 0 0 0; font-size: 1rem; }
        
        h2 { margin-top: 0; font-size: 1.2rem; color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9rem;}
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;}
        .time-container { display: flex; gap: 10px; }
        button { background-color: #4CAF50; color: white; border: none; font-size: 16px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #a5d6a7; cursor: not-allowed; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 0.9rem;}
        
        .table-header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;}
        .table-header-container button { width: auto; margin: 0; padding: 8px 15px; font-size: 0.85rem; }
        .table-header-container select { width: auto; margin: 0; padding: 8px; font-size: 0.9rem; font-weight: bold;}
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { border: 1px solid #ddd; padding: 10px 8px; text-align: center; }
        th { background-color: #f8f9fa; color: #333; }
        .ot-highlight { color: #d9534f; font-weight: bold; }
        .activity-text { font-size: 0.75rem; color: #555; font-style: italic; text-align: left; }
    </style>
</head>
<body>
    <div class="card header-card">
        <h1>Timesheet App</h1>
        <p>Nama: <strong>Maryadi</strong></p>
    </div>

    <div class="card">
        <h2>Input Jam Selesai</h2>
        <form id="reportForm">
            <label for="tanggal_picker">Tanggal:</label>
            <input type="date" id="tanggal_picker" required>
            
            <label>Jam Selesai (24 Jam):</label>
            <div class="time-container">
                <select id="jam_dropdown" required></select>
                <select id="menit_dropdown" required></select>
            </div>
            
            <label for="aktivitas">Aktivitas Terakhir (Wajib):</label>
            <input type="text" id="aktivitas" placeholder="Misalnya: Antar Elyssa les dan renang." required>

            <button type="submit" id="btnSubmit">Simpan & Hitung OT</button>
        </form>
        <div id="status"></div>
    </div>

    <div class="card">
        <h2>Riwayat Timelog & OT</h2>
        
        <div class="table-header-container">
            <button id="btnRefresh" style="background-color: #2196F3;">Muat Ulang</button>
            <select id="monthFilter" title="Pilih Bulan"></select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>In</th>
                    <th>Out</th>
                    <th>OT</th>
                    <th>Aktivitas</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxtOSW5Xzeemwh5zCsq3vp9hBc6ANVmhcOSD0-4CulOyBquoo4f1Vhq4jFlCFOq4BOt/exec";
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        let allLogData = []; 

        const jamDropdown = document.getElementById('jam_dropdown');
        const menitDropdown = document.getElementById('menit_dropdown');
        for (let i = 0; i < 24; i++) jamDropdown.add(new Option(String(i).padStart(2, '0')));
        for (let i = 0; i < 60; i++) menitDropdown.add(new Option(String(i).padStart(2, '0')));

        function formatDateToSpreadsheet(dateString) {
            const date = new Date(dateString);
            const day = date.getDate();
            const month = monthNames[date.getMonth()];
            const year = String(date.getFullYear()).slice(-2);
            return `${day}-${month}-${year}`; 
        }

        // Ekstraksi bulan lebih tangguh tanpa Date parsing dari browser
        function extractMonthYear(tanggalStr) {
            if (!tanggalStr) return "";
            let str = String(tanggalStr);
            let parts = str.split("-");
            if (parts.length >= 2) {
                let m = parts[1]; // misal "Sep"
                let y = parts.length === 3 ? parts[2].slice(-2) : "26"; // Fallback ke 26 jika data lama
                return m + "-" + y;
            }
            return "";
        }

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            document.getElementById('tanggal_picker').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            jamDropdown.value = String(today.getHours()).padStart(2, '0');
            menitDropdown.value = String(today.getMinutes()).padStart(2, '0');
            
            const currentMonthYear = monthNames[today.getMonth()] + "-" + String(today.getFullYear()).slice(-2);
            document.getElementById('monthFilter').innerHTML = `<option value="${currentMonthYear}">${currentMonthYear}</option>`;
            
            loadTableData();
        });

        document.getElementById('monthFilter').addEventListener('change', renderTable);
        document.getElementById('btnRefresh').addEventListener('click', loadTableData);

        function loadTableData() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="5">Memuat data...</td></tr>';
            
            fetch(WEB_APP_URL + "?action=read")
                .then(response => {
                    if (!response.ok) throw new Error("Gagal terhubung ke Google (Status: " + response.status + ")");
                    return response.json();
                })
                .then(data => {
                    try {
                        allLogData = Array.isArray(data) ? data : [];
                        updateMonthDropdown();
                        renderTable();
                    } catch (renderError) {
                        // Menangkap error JavaScript murni (seperti bug sortir di mobile)
                        tbody.innerHTML = `<tr><td colspan="5" style="color:red; text-align:left;">Error Sistem: ${renderError.message}</td></tr>`;
                    }
                })
                .catch(error => {
                    tbody.innerHTML = `<tr><td colspan="5" style="color:red; text-align:left;">Error Koneksi: ${error.message}</td></tr>`;
                });
        }

        function updateMonthDropdown() {
            const filter = document.getElementById('monthFilter');
            const currentValue = filter.value;
            const uniqueMonths = new Set();
            
            const today = new Date();
            const currentMonthYear = monthNames[today.getMonth()] + "-" + String(today.getFullYear()).slice(-2);
            uniqueMonths.add(currentMonthYear);
            
            allLogData.forEach(row => {
                let extracted = extractMonthYear(row.tanggal);
                if (extracted) uniqueMonths.add(extracted);
            });

            // Logika Sortir Baru: Murni pakai indeks array tanpa Date() engine browser
            const sortedMonths = Array.from(uniqueMonths).sort((a, b) => {
                const partsA = a.split("-"); // ["Sep", "26"]
                const partsB = b.split("-");
                
                const monthA = monthNames.indexOf(partsA[0]);
                const yearA = parseInt(partsA[1] || "0", 10);
                
                const monthB = monthNames.indexOf(partsB[0]);
                const yearB = parseInt(partsB[1] || "0", 10);
                
                if (yearA !== yearB) {
                    return yearB - yearA; // Tahun terbaru di atas
                }
                return monthB - monthA; // Bulan terbaru di atas
            });

            filter.innerHTML = '';
            sortedMonths.forEach(m => filter.add(new Option(m, m)));

            if (sortedMonths.includes(currentValue)) {
                filter.value = currentValue;
            } else {
                filter.value = currentMonthYear;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const selectedMonth = document.getElementById('monthFilter').value;
            
            tbody.innerHTML = '';
            
            const filteredData = allLogData.filter(row => extractMonthYear(row.tanggal) === selectedMonth);

            if(filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">Belum ada data untuk bulan ini</td></tr>';
                return;
            }

            filteredData.forEach(row => {
                let otClass = (row.ot && row.ot !== "0" && row.ot !== 0 && row.ot !== "") ? "ot-highlight" : "";
                let aktivitasTeks = row.aktivitas || '-';
                let tr = `<tr>
                    <td>${row.tanggal}</td>
                    <td>${row.clockin || '-'}</td>
                    <td>${row.clockout || '-'}</td>
                    <td class="${otClass}">${row.ot || '-'}</td>
                    <td class="activity-text">${aktivitasTeks}</td>
                </tr>`;
                tbody.innerHTML += tr;
            });
        }

        document.getElementById('reportForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const statusDiv = document.getElementById('status');
            
            btn.disabled = true;
            statusDiv.innerText = "Mengecek & Menyimpan data...";
            statusDiv.style.color = "blue";

            const formattedDate = formatDateToSpreadsheet(document.getElementById('tanggal_picker').value);
            const jamSelesai = jamDropdown.value + ":" + menitDropdown.value;
            const aktivitasVal = encodeURIComponent(document.getElementById('aktivitas').value);
            
            const submitUrl = `${WEB_APP_URL}?action=write&tanggal=${formattedDate}&jam_selesai=${jamSelesai}&aktivitas=${aktivitasVal}`;

            fetch(submitUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "Berhasil") {
                        statusDiv.innerText = "Berhasil disimpan! Estimasi OT: " + data.ot + " Jam";
                        statusDiv.style.color = "green";
                        document.getElementById('aktivitas').value = "";
                    } else {
                        statusDiv.innerText = data.message;
                        statusDiv.style.color = "red";
                    }
                    btn.disabled = false;
                    loadTableData(); 
                })
                .catch(error => {
                    statusDiv.innerText = "Gagal terhubung ke server.";
                    statusDiv.style.color = "red";
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
