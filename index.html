<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timelog & Laporan OT Driver</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; background-color: #f0f2f5;}
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px;}
        
        /* Style khusus untuk header identitas */
        .header-card { background-color: #2196F3; color: white; text-align: center; }
        .header-card h1 { margin: 0; font-size: 1.5rem; }
        .header-card p { margin: 5px 0 0 0; font-size: 1rem; }
        
        h2 { margin-top: 0; font-size: 1.2rem; color: #333; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.9rem;}
        input, select, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;}
        .time-container { display: flex; gap: 10px; }
        button { background-color: #4CAF50; color: white; border: none; font-size: 16px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #a5d6a7; cursor: not-allowed; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 0.9rem;}
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85rem; }
        th, td { border: 1px solid #ddd; padding: 10px 8px; text-align: center; }
        th { background-color: #f8f9fa; color: #333; }
        .ot-highlight { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>
    <!-- Header Aplikasi -->
    <div class="card header-card">
        <h1>Timesheet App</h1>
        <p>Nama: <strong>Maryadi</strong></p>
    </div>

    <div class="card">
        <h2>Input Jam Selesai</h2>
        <form id="reportForm">
            <label for="tanggal_picker">Tanggal:</label>
            <input type="date" id="tanggal_picker" required>
            
            <label>Jam Selesai (24 Jam):</label>
            <div class="time-container">
                <select id="jam_dropdown" required></select>
                <select id="menit_dropdown" required></select>
            </div>

            <button type="submit" id="btnSubmit">Simpan & Hitung OT</button>
        </form>
        <div id="status"></div>
    </div>

    <div class="card">
        <h2>Riwayat Timelog & OT</h2>
        <button id="btnRefresh" style="background-color: #2196F3; margin-top:0; padding: 8px; font-size: 0.9rem;">Muat Ulang Data</button>
        <table>
            <thead>
                <tr>
                    <th>Tanggal</th>
                    <th>In</th>
                    <th>Out</th>
                    <th>OT</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="4">Memuat data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // PASTIKAN URL INI ADALAH URL DARI HASIL "NEW DEPLOYMENT" TERBARU ANDA
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxtOSW5Xzeemwh5zCsq3vp9hBc6ANVmhcOSD0-4CulOyBquoo4f1Vhq4jFlCFOq4BOt/exec";

        // Populate Dropdown
        const jamDropdown = document.getElementById('jam_dropdown');
        const menitDropdown = document.getElementById('menit_dropdown');
        for (let i = 0; i < 24; i++) jamDropdown.add(new Option(String(i).padStart(2, '0')));
        for (let i = 0; i < 60; i++) menitDropdown.add(new Option(String(i).padStart(2, '0')));

        function formatDateToSpreadsheet(dateString) {
            const date = new Date(dateString);
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return date.getDate() + "-" + monthNames[date.getMonth()];
        }

        // Set default date & time
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            document.getElementById('tanggal_picker').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            jamDropdown.value = String(today.getHours()).padStart(2, '0');
            menitDropdown.value = String(today.getMinutes()).padStart(2, '0');
            
            loadTableData();
        });

        // Load Data function (GET Request)
        function loadTableData() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '<tr><td colspan="4">Memuat data...</td></tr>';
            
            fetch(WEB_APP_URL + "?action=read")
                .then(response => response.json())
                .then(data => {
                    tbody.innerHTML = '';
                    if(data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4">Belum ada data</td></tr>';
                        return;
                    }
                    data.forEach(row => {
                        // Cek highlight merah (jika nilai OT bukan 0 dan tidak kosong)
                        let otClass = (row.ot && row.ot !== "0" && row.ot !== 0 && row.ot !== "") ? "ot-highlight" : "";
                        let tr = `<tr>
                            <td>${row.tanggal}</td>
                            <td>${row.clockin || '-'}</td>
                            <td>${row.clockout || '-'}</td>
                            <td class="${otClass}">${row.ot || '-'}</td>
                        </tr>`;
                        tbody.innerHTML += tr;
                    });
                })
                .catch(error => {
                    tbody.innerHTML = '<tr><td colspan="4" style="color:red;">Gagal memuat data</td></tr>';
                });
        }

        document.getElementById('btnRefresh').addEventListener('click', loadTableData);

        // Submit Data (GET Request Bypass CORS)
        document.getElementById('reportForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const statusDiv = document.getElementById('status');
            
            btn.disabled = true;
            statusDiv.innerText = "Mengecek & Menyimpan data...";
            statusDiv.style.color = "blue";

            const formattedDate = formatDateToSpreadsheet(document.getElementById('tanggal_picker').value);
            const jamSelesai = jamDropdown.value + ":" + menitDropdown.value;
            
            const submitUrl = `${WEB_APP_URL}?action=write&tanggal=${formattedDate}&jam_selesai=${jamSelesai}`;

            fetch(submitUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "Berhasil") {
                        // Menambahkan teks "Jam" murni di tampilan HTML saja agar mudah dibaca, 
                        // sedangkan di Google Sheets tetap tersimpan sebagai angka murni.
                        statusDiv.innerText = "Berhasil disimpan! Estimasi OT: " + data.ot + " Jam";
                        statusDiv.style.color = "green";
                    } else {
                        statusDiv.innerText = data.message;
                        statusDiv.style.color = "red";
                    }
                    btn.disabled = false;
                    loadTableData(); 
                })
                .catch(error => {
                    statusDiv.innerText = "Gagal terhubung ke server.";
                    statusDiv.style.color = "red";
                    btn.disabled = false;
                });
        });
    </script>
</body>
</html>
